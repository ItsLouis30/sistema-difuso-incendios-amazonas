# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: sistema-difuso-g8-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install ./backend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://sistema-difuso-g8-web.onrender.com

  - type: web
    name: sistema-difuso-g8-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://sistema-difuso-g8-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
